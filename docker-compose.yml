# Levanta todo el sistema con un solo comando:  docker compose up --build
#   - db:     Postgres 17
#   - api:    FastAPI + panel web en http://localhost:8000 (aplica migraciones y carga la demo)
#   - worker: scheduler autónomo; procesa ./inbox, descarga del portal del proveedor
#             con Playwright y genera el reporte diario
x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://opsagent:opsagent@db:5432/opsagent
    LLM_MODE: ${LLM_MODE:-hybrid}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: opsagent
      POSTGRES_PASSWORD: opsagent
      POSTGRES_DB: opsagent
    ports:
      - "5433:5432"  # 5433 on the host to avoid clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsagent -d opsagent"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    environment:
      <<: *app-env
      BOOTSTRAP_DEMO: "true"
    ports:
      - "8000:8000"

  worker:
    <<: *app
    build:
      context: .
      args:
        WITH_BROWSER: "true"  # Chromium for the supplier-portal robot
    command: ["python", "-m", "opsagent.worker"]
    environment:
      <<: *app-env
      SCHEDULER_ENABLED: "true"
      INBOX_DIR: /inbox
      PORTAL_SYNC_ENABLED: "true"
      PORTAL_URL: http://api:8000/portal
      PROCESS_INTERVAL_MINUTES: ${PROCESS_INTERVAL_MINUTES:-2}
    volumes:
      - ./inbox:/inbox
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
